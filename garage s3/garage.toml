# ============================================================================
#  Garage S3 — конфиг одного узла под медиа Matrix.  Версия: Garage v2.3.0.
#  Док-референс со ВСЕМИ параметрами:
#    https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
#  Решение по дискам: meta И data — ОБА на ZFS-зеркале (редундантность важнее
#  скромного выигрыша от одиночного SSD; горячую метадату кэширует ZFS ARC в RAM).
# ============================================================================

# ---------------- ХРАНИЛИЩЕ ----------------
# Оба пути ведут на mount-point ZFS-пула внутри LXC (настроим на шаге Proxmox/LVM).
# meta — БД индексов (мелкий рандом, дёргается на каждой операции).
# data — сами блоки-объекты (крупные, последовательные).
metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
# Если позже добавишь несколько дисков — можно списком с ёмкостью:
# data_dir = [
#   { path = "/mnt/disk1", capacity = "1T" },
#   { path = "/mnt/disk2", capacity = "2T" },
#   { path = "/mnt/ssd-cache", capacity = "100G" },
# ]

# ---------------- ДВИЖОК МЕТАДАННЫХ ----------------
# lmdb  — дефолт, самый быстрый, рекомендованный (Postgres/внешние БД Garage НЕ поддерживает).
# sqlite — проще, медленнее. fjall — экспериментальный (LSM, выше write-throughput).
db_engine = "lmdb"

# fsync метаданных. ДЕФОЛТ false. true = безопаснее при потере питания, НО на HDD РЕЗКО
# тормозит запись (каждый объект ждёт sync на шпиндель -> S3-аплоад ползёт). На ZFS-зеркале
# + metadata_auto_snapshot оставляем дефолтный false (быстро; ZFS и так crash-consistent).
metadata_fsync = false
# fsync блоков данных: ещё надёжнее, но медленнее. На ZFS не нужно.
data_fsync = false

# АВТО-СНАПШОТЫ метаданных (point-in-time, лежат внутри metadata_dir -> тоже на зеркале).
# Дополнительная страховка от повреждения БД. Откатиться можно офлайн.
metadata_auto_snapshot_interval = "6h"

# Сжатие блоков (zstd). Диапазон 1-19 (+ "ультра" 20-22). Чем выше — тем больше CPU на запись;
# на медиа (jpg/mp4) эффекта почти нет, на бэкапах/тексте — заметный. Выбран 10 (сильнее жмёт
# compressible-данные ценой CPU при записи; чтение от уровня не зависит). Для чисто медиа хватило бы 1-3.
compression_level = 10

# ---------------- РЕПЛИКАЦИЯ ----------------
# Один узел = одна копия (редундантность у нас на уровне ZFS-зеркала).
# Добавишь второй узел Garage на другой машине -> поставь 2 или 3 (гео-реплика поверх ZFS).
replication_factor = 1

# ---------------- RPC (межузловой обмен) ----------------
# ВЕСЬ блок НЕ комментировать: rpc_secret ОБЯЗАТЕЛЕН даже для одной ноды (без него Garage не стартует).
# Порт 3901 наружу не публикуем (нужен только мультиноде). rpc_public_addr для одной ноды можно убрать.
rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"      # опц. для одной ноды; важен при мультиноде
# общий секрет кластера (32 байта hex):  openssl rand -hex 32
rpc_secret = "ur_hash" # openssl rand -hex 32

# ---------------- S3 API (сюда ходят Synapse напрямую и Traefik) ----------------
[s3_api]
s3_region     = "garage"                # то же имя укажешь в Synapse
api_bind_addr = "[::]:3900"
# Включает vhost-style (bucket.s3.домен). САМ домены НЕ создаёт: для реальной работы vhost нужны
# wildcard-DNS *.s3.example.com + wildcard-сертификат + роутер в Traefik. Для path-style
# (s3.example.com/bucket) это НЕ нужно
root_domain   = ".s3.example.com"

# ---------------- S3 web (раздача статики из бакета) — для медиа НЕ нужно ----------------
# [s3_web]
# bind_addr   = "[::]:3902"
# root_domain = ".s3.example.com"
# index       = "index.html"

# ---------------- Admin API (метрики + управление; его дёргает garage-webui) ----------------
[admin]
api_bind_addr = "[::]:3903"
admin_token   = "ur_hash" # openssl rand -base64 30
metrics_token = "ur_hash" # openssl rand -base64 30
# trace_sink  = "http://localhost:4317"   # опц.: OpenTelemetry-трейсы
