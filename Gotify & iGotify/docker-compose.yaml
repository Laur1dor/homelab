services:
  gotify:
    image: gotify/server
    container_name: gotify
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - 8080:80
    environment:
      GOTIFY_DEFAULTUSER_PASS: 'admin'
      GOTIFY_DEFAULTUSER_NAME: 'admin' # при первом входе изменить
    volumes:
      - /opt/gotify_data/:/app/data


  igotify:
    container_name: igotify
    hostname: igotify
    image: ghcr.io/androidseb25/igotify-notification-assist:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    ports:
      - 8081:8080
    volumes:
      - /opt/gotify-data/api-data/:/app/data
    depends_on:
      - gotify