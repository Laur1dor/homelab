services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: "ur_token" # я не помню как он генерился, но он нужен при входе на https://vw.example.com/admin
    volumes:
      - /opt/vw-data/:/data/
    ports:
      - 8000:80